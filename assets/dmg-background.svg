<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- The window of Glist Studio's disk image: the app on the left, Applications
       on the right (see MakerDMG in forge.config.ts). Rendered to
       dmg-background.png and dmg-background@2x.png at 1x and 2x. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/>
      <stop offset="1" stop-color="#eceef2"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#ground)"/>
  <path d="M286 150h58" fill="none" stroke="#a3a8b3" stroke-width="3" stroke-linecap="round"/>
  <path d="M334 138l14 12-14 12" fill="none" stroke="#a3a8b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" fill="#6e7380">
    <text x="320" y="286">Drag Glist Studio into Applications to install it</text>
    <text x="320" y="306">Kurmak için Glist Studio’yu Uygulamalar’a sürükleyin</text>
  </g>
</svg>
