name: Release builds

# Builds the installers for every platform: on a version tag, into a draft
# GitHub release that a maintainer checks and publishes; on every push to main,
# into a prerelease published at once and numbered after the last release, such
# as 0.0.4-dev.12; and by hand from the Actions tab.
on:
  push:
    branches: [main]
    # Prerelease tags come from this workflow and are not built again.
    tags: ['v*', '!v*-dev.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit and tag, to count main's commits since the last release.
          fetch-depth: 0
      - id: version
        name: Choose the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # The next patch after the last release, then main's commits since it.
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)
            IFS=. read -r major minor patch <<< "${tag:-v0.0.0}"
            count=$(git rev-list --count ${tag:+"$tag.."}HEAD)
            version="${major#v}.$minor.$((patch + 1))-dev.$count"
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    # A newer push to the same branch stops this build, so merging several pull
    # requests at once builds and publishes only the last; the older runs end as
    # cancelled. Only builds are stopped, never a prerelease being published,
    # and a version tag's build always finishes.
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.label }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        # maker is a maker's name in forge.config.ts, so the one configured there,
        # icons and all, makes it; a package name would make a plain one.
        include:
          - name: macOS universal
            os: macos-latest
            platform: darwin
            arch: universal
            maker: dmg
            label: macos-universal
          - name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
            maker: squirrel
            label: windows-x64
          # Built on x64: the app has no native modules, and the Squirrel
          # installer runs under emulation on Windows on ARM.
          - name: Windows arm64
            os: windows-latest
            platform: win32
            arch: arm64
            maker: squirrel
            label: windows-arm64
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux
            arch: x64
            maker: AppImage
            label: linux-x86_64
          - name: Linux aarch64
            os: ubuntu-latest
            platform: linux
            arch: arm64
            maker: AppImage
            label: linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install mksquashfs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - run: npm ci
      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"
      # Glist's Developer ID certificate, in a keychain of its own for this run,
      # and the App Store Connect key Apple's notary service takes, for
      # forge.config.ts to sign and notarize the Mac app with. Only this step
      # and Make on macOS see them. Without the secrets, as in a fork, the app
      # is signed ad hoc as before.
      - name: Load the signing certificate
        if: matrix.platform == 'darwin'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$APPLE_API_KEY" ]; then
            echo "No signing secrets: the app is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_FILE=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
      - name: Make
        env:
          APPLE_API_KEY_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'darwin' && secrets.APPLE_API_ISSUER || '' }}
        run: npx electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --targets=${{ matrix.maker }}
      # A signing or notarization that did not take fails the build here, before anything is published.
      - name: Check the signature
        if: matrix.platform == 'darwin' && env.MACOS_KEYCHAIN != ''
        run: |
          app=$(find out -maxdepth 2 -name '*.app' -type d | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime Version)'
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - name: Remove the signing keychain
        if: always() && matrix.platform == 'darwin' && env.MACOS_KEYCHAIN != ''
        run: |
          security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -f "$APPLE_API_KEY_FILE"
      - name: Name the installer
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir dist
          case "${{ matrix.platform }}" in
            darwin) find out/make -name '*.dmg' -exec cp {} "dist/Glist-Studio-$version-${{ matrix.label }}.dmg" \; ;;
            win32) find out/make -name '*Setup.exe' -exec cp {} "dist/Glist-Studio-$version-${{ matrix.label }}-setup.exe" \; ;;
            linux) find out/make -name '*.AppImage' -exec cp {} "dist/Glist-Studio-$version-${{ matrix.label }}.AppImage" \; ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: glist-studio-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # The only job that can write: it creates the draft release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Glist Studio ${GITHUB_REF_NAME}"

  prerelease:
    name: Prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    # Writes like the release job: it publishes the prerelease and its tag, and
    # removes the ones before it.
    permissions:
      contents: write
    # One at a time, so removing old prereleases never races a newer one.
    concurrency:
      group: prerelease
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      # The newest prerelease is enough: older ones are removed with their tags,
      # and any commit can be built again.
      KEEP: 1
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the prerelease
        run: |
          message=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message)
          printf '%s\n\nBuilt from %s on main, to try changes before they are released. Glist Studio updates itself to prereleases only with Get previews too on, in Settings.\n' \
            "$message" "$GITHUB_SHA" > notes.md
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Glist Studio v$VERSION" --notes-file notes.md
      - name: Remove old prereleases
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+[.][0-9]+[.][0-9]+-dev[.][0-9]+$")))]
              | sort_by(.createdAt) | reverse | .['"$KEEP"':][] | .tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
          # Prerelease tags whose release is gone already, as earlier runs left them.
          # Release tags, vX.Y.Z without a -dev part, are never touched.
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName')
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")' |
            { grep -E '^v[0-9]+[.][0-9]+[.][0-9]+-dev[.][0-9]+$' || true; } |
          while read -r tag; do
            grep -qxF "$tag" <<< "$releases" || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          done
